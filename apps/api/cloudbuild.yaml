steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:$COMMIT_SHA
      - -f
      - apps/api/Dockerfile
      - apps/api

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cubecompro-v2
      - --image=gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=8080

images:
  - gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY