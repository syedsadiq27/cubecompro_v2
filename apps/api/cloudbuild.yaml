steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -c
      - |
        docker pull gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:latest || true
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from=gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:latest \
          -t gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:latest \
          -f apps/api/Dockerfile \
          .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cubecompro-v2
      - --image=gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=8080
      - --timeout=300
      - --cpu-boost
      - --update-env-vars=NODE_ENV=production,KERNEL_MIGRATE_RULES=off

images:
  - gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/github.com/syedsadiq27/cubecompro_v2:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
